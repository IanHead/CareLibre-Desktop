[package]
name = "carelibre-desktop"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "GPL-3.0-or-later"
description = "Fast, native desktop client for the CareLibre care management platform"
repository = "https://github.com/IanHead/CareLibre-Desktop"
publish = false

[dependencies]
eframe = { version = "0.37", default-features = false, features = [
    "accesskit",
    "clipboard",
    "default_fonts",
    "links",
    "wayland",
    "wgpu",
    "x11",
] }

# Enables the bundled monochrome emoji font so navigation icons render on every
# platform without relying on system fonts.
egui = { version = "0.37", features = ["monochrome_emoji_fonts"] }

directories = "6"
keyring = "4.2"
chacha20poly1305 = "0.10"
getrandom = "0.2"
hex = "0.4"
machine-uid = "0.6"
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "3.5", default-features = false, features = ["rustls"] }
url = "2"
uuid = { version = "1", features = ["v7"] }

arc-swap = "1.9"
chrono = "0.4"
crossbeam-channel = "0.5"
rusqlite = { version = "0.41", default-features = false, features = ["bundled"] }

# System appearance detection through the freedesktop settings portal.
[target.'cfg(target_os = "linux")'.dependencies]
zbus = "5"

[dev-dependencies]
egui_kittest = { version = "0.37", features = ["wgpu"] }
image = { version = "0.25", default-features = false, features = ["png"] }

[profile.dev]
opt-level = 2

[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
