name: Release

# Portable desktop builds for Windows, Linux and macOS.
#
# Push a version tag (for example `v0.1.0`) or run the workflow manually with a
# tag name. Each runner builds natively (macOS builds both slices there), then a
# single publish job collects the archives, writes SHA-256 checksums and attaches
# everything to the GitHub release for that tag.
#
# Release notes are hand-written in docs/release-notes/<tag>.md. The workflow
# refuses to publish without the New, Changed and Fixed sections.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish (for example v0.1.0)"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  BIN_NAME: carelibre-desktop

jobs:
  release-notes:
    name: Release notes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Validate release notes
        shell: bash
        run: |
          file="docs/release-notes/${{ inputs.tag || github.ref_name }}.md"
          if [ ! -f "$file" ]; then
            echo "::error::Missing $file. Create it from docs/release-notes/TEMPLATE.md."
            exit 1
          fi
          for section in New Changed Fixed; do
            if ! tr -d '\r' < "$file" | grep -qx "## ${section}"; then
              echo "::error::$file is missing the '## $section' section."
              exit 1
            fi
          done

  checks:
    name: Checks
    needs: release-notes
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ inputs.tag || github.ref }}

  build:
    name: ${{ matrix.name }}
    needs: checks
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            exe: .exe
          # Build on 22.04 so the binary runs on distributions with older glibc.
          - name: linux-x64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            exe: ""
          - name: macos-arm64
            os: macos-latest
            target: aarch64-apple-darwin
            exe: ""
          - name: macos-x64
            os: macos-latest
            target: x86_64-apple-darwin
            exe: ""

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-dev \
            libwayland-dev \
            libx11-dev \
            libxcb1-dev \
            libxrandr-dev \
            libxi-dev \
            libxcursor-dev \
            libgl1-mesa-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Stage files
        shell: bash
        run: |
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/${BIN_NAME}${{ matrix.exe }}" dist/
          cp README.md LICENSE dist/

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path dist/* -DestinationPath "${env:BIN_NAME}-${{ matrix.name }}.zip"

      - name: Package (Linux and macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: tar -czf "$BIN_NAME-${{ matrix.name }}.tar.gz" -C dist .

      - name: Upload archive
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: |
            *.zip
            *.tar.gz
          if-no-files-found: error

  publish:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Download archives
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate SHA-256 checksums
        working-directory: artifacts
        run: |
          sha256sum *.zip *.tar.gz > SHA256SUMS
          cat SHA256SUMS

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          name: CareLibre Desktop ${{ inputs.tag || github.ref_name }}
          body_path: docs/release-notes/${{ inputs.tag || github.ref_name }}.md
          fail_on_unmatched_files: true
          files: artifacts/*
