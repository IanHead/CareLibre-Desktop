name: CI

# Development checks run locally (see AGENTS.md). GitHub Actions is the release
# gate: the release workflow calls this workflow before building, and it can be
# run manually when needed.

on:
  workflow_call:
    inputs:
      ref:
        description: "Git ref to check. Defaults to the caller's ref."
        required: false
        type: string
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref to check. Defaults to the selected branch."
        required: false
        type: string

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Formatting
        if: matrix.os == 'ubuntu-latest'
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Tests
        run: cargo test

      - name: Build
        run: cargo build --release
