name: Feature request
description: Suggest a new capability or improvement for CareLibre Desktop.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting an improvement.

        Please check the [canonical product roadmap](https://github.com/IanHead/CareLibre/blob/main/docs/roadmap.md)
        and search [existing issues](https://github.com/IanHead/CareLibre-Desktop/issues)
        before opening a request.

  - type: checkboxes
    id: preflight
    attributes:
      label: Before you start
      options:
        - label: I have checked the roadmap and searched existing issues.
          required: true
        - label: I have not included passwords, tokens, or personal or health information in this request.
          required: true

  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Describe the need and who it helps. Real care-provider workflows are more useful than abstract features.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What would you like to happen?
      description: Describe the behaviour or capability you have in mind.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches, existing workarounds, or how other tools handle this.
    validations:
      required: false

  - type: dropdown
    id: area
    attributes:
      label: Area
      description: Which part of CareLibre does this mostly affect?
      options:
        - Launch / workspace
        - Contacts
        - Contact editor
        - Relationships / constellation
        - Intake
        - Organisations
        - Rostering / suitability
        - Funding / quotes / agreements
        - Settings / sign-in
        - Appearance / windows
        - Performance
        - Other / not sure
    validations:
      required: true

  - type: dropdown
    id: scope
    attributes:
      label: Likely scope
      description: Some features need server or API work before the desktop can support them.
      options:
        - Desktop only
        - Needs server or API changes
        - Not sure
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Mockups, examples, links, or anything else that would help evaluate the request.
    validations:
      required: false

  - type: checkboxes
    id: contribution
    attributes:
      label: Contribution
      options:
        - label: I would be willing to help implement or test this.
          required: false
